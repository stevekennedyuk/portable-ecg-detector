name: verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  c-verification:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Unit and strict compiler tests
        env:
          CC: ${{ matrix.compiler }}
        run: |
          make test
          make strict

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Address and undefined-behaviour sanitizers
        env:
          CC: clang
        run: make sanitize

  python-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install numpy==2.5.3 pyedflib==0.1.42 wfdb==4.3.1
      - name: Python and format tests
        env:
          CC: clang
        run: make test-python
